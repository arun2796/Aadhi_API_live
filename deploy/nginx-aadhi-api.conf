# nginx site for the Aadhi Crackers API.
#
# Install:
#   sudo cp deploy/nginx-aadhi-api.conf /etc/nginx/sites-available/aadhi-api
#   sudo ln -sf /etc/nginx/sites-available/aadhi-api /etc/nginx/sites-enabled/aadhi-api
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot rewrite this file with the real certificate:
#   sudo certbot --nginx -d api.aadhicracker.in
#
# Replace api.aadhicracker.in below with your actual API hostname first.

upstream aadhi_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aadhicracker.in;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 as a listen flag, NOT the standalone "http2 on;" directive: that directive only
    # exists from nginx 1.25.1, and Ubuntu 24.04 ships 1.24 — where it fails nginx -t with
    # 'unknown directive "http2"'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aadhicracker.in;

    # certbot --nginx fills these in. Until it runs, comment this server block out
    # or nginx will fail to start for want of a certificate.
    ssl_certificate     /etc/letsencrypt/live/api.aadhicracker.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aadhicracker.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Product images are served by Cloudflare R2, not from here, so uploads are the
    # only large bodies this server sees. The API itself caps an image at 8 MB.
    client_max_body_size 12M;

    # Long-running admin reports occasionally exceed the 60s default.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # CORS is handled by the application (Cors__AllowedOrigins), deliberately NOT here.
    # Setting CORS headers in both places produces duplicate headers, which browsers reject.

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://aadhi_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
    }

    # Health endpoints are for the deploy script and uptime monitoring; keeping them
    # out of the access log stops them from drowning real traffic.
    location /health {
        proxy_pass http://aadhi_api;
        proxy_set_header Host $host;
        access_log off;
    }
}
