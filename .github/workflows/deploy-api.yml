name: Deploy API to Lightsail

# Pushes to ak-dev — the working branch — ship to production; the test job is the gate.
# Run it by hand from the Actions tab to redeploy the same commit — for example after
# editing /etc/aadhi-api/aadhi-api.env on the server.
on:
  push:
    branches: [ak-dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One deploy at a time, and NEVER cancel one in flight: a cancelled run can leave the release
# half-rsynced or the service mid-restart. A second push waits its turn instead.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  # Self-contained: the Lightsail instance needs no .NET runtime installed.
  # Change to linux-arm64 if the instance is an ARM (Graviton) Lightsail blueprint.
  RUNTIME_ID: linux-x64
  APP_ROOT: /var/www/aadhi-api

jobs:
  # Fails in seconds if configuration is missing, rather than after a full build and test run.
  preflight:
    name: Check configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required secrets are present
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          missing=()
          if [ -z "$LIGHTSAIL_HOST" ];    then missing+=("LIGHTSAIL_HOST"); fi
          if [ -z "$LIGHTSAIL_USER" ];    then missing+=("LIGHTSAIL_USER"); fi
          if [ -z "$LIGHTSAIL_SSH_KEY" ]; then missing+=("LIGHTSAIL_SSH_KEY"); fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. Add them under Settings → Secrets and variables → Actions → Secrets. See docs/GITHUB_ACTIONS.md."
            exit 1
          fi

          # ── Normalise, do not nitpick ──────────────────────────────────────────────
          # Pasting into the GitHub secret box picks up a trailing newline that is invisible in
          # the UI. Left alone it surfaces much later as ssh's "remote username contains invalid
          # characters", printed as "Cannot SSH to ***\n@***" because Actions masks the value —
          # an error that names nothing useful.
          #
          # A trailing newline has exactly one sensible interpretation, so this STRIPS it and
          # warns rather than failing: refusing to deploy over a stray whitespace character the
          # very next step already removes would be pedantry, not safety. Only values that stay
          # unusable after normalising are fatal.
          #
          # Reported by SHAPE (character counts) because the values are masked and cannot be
          # echoed back usefully.
          clean_user="$(printf '%s' "$LIGHTSAIL_USER" | tr -d '[:space:]')"
          clean_host="$(printf '%s' "$LIGHTSAIL_HOST" | tr -d '[:space:]')"

          if [ "${#clean_user}" -ne "${#LIGHTSAIL_USER}" ]; then
            echo "::warning::LIGHTSAIL_USER had whitespace (${#LIGHTSAIL_USER} characters, ${#clean_user} once stripped) — almost certainly a trailing newline from pasting. Using the stripped value. Worth re-entering the secret cleanly."
          fi
          if [ "${#clean_host}" -ne "${#LIGHTSAIL_HOST}" ]; then
            echo "::warning::LIGHTSAIL_HOST had whitespace (${#LIGHTSAIL_HOST} characters, ${#clean_host} once stripped) — almost certainly a trailing newline from pasting. Using the stripped value. Worth re-entering the secret cleanly."
          fi

          # A URL where a host belongs is also unambiguous: take the hostname out of it.
          case "$clean_host" in
            http://*|https://*)
              clean_host="${clean_host#*://}"
              clean_host="${clean_host%%/*}"
              echo "::warning::LIGHTSAIL_HOST looked like a URL. ssh needs a bare host, so the scheme and path were dropped. Worth re-entering it as just the IP or hostname." ;;
          esac
          clean_host="${clean_host%%/*}"

          # "ubuntu@1.2.3.4" in the USER field: the username is the part before the @.
          case "$clean_user" in
            *@*)
              clean_user="${clean_user%%@*}"
              echo "::warning::LIGHTSAIL_USER contained '@' — took the part before it as the username. Put only the login name in this secret." ;;
          esac

          # ── Fatal only when normalising cannot save it ─────────────────────────────
          if [ -z "$clean_user" ] || [ -z "$clean_host" ]; then
            echo "::error::LIGHTSAIL_USER or LIGHTSAIL_HOST is empty once whitespace is removed."
            exit 1
          fi

          # A host with an '@' left in it is genuinely ambiguous — which half is the host?
          case "$clean_host" in
            *@*) echo "::error::LIGHTSAIL_HOST still contains '@' after normalising. Put the username in LIGHTSAIL_USER and only the hostname or IP here."; exit 1 ;;
          esac

          # A Linux login name: lowercase start, then letters/digits/_/-. Anything else (an email
          # address, a stray quote) cannot be guessed at safely.
          if printf '%s' "$clean_user" | grep -qv '^[a-z_][a-z0-9_-]*$'; then
            echo "::error::LIGHTSAIL_USER is not a valid Linux username. On the Ubuntu Lightsail blueprint it is 'ubuntu'."
            exit 1
          fi

          # A key pasted through a form often loses its trailing newline or arrives as a
          # PuTTY .ppk. Both produce "libcrypto: error" from ssh, which names nothing useful.
          case "$LIGHTSAIL_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*) ;;
            *"PuTTY-User-Key-File"*)
              echo "::error::LIGHTSAIL_SSH_KEY is a PuTTY .ppk key. Convert it with: puttygen key.ppk -O private-openssh -o key.pem"
              exit 1 ;;
            *)
              echo "::error::LIGHTSAIL_SSH_KEY does not look like an OpenSSH private key. Paste the PRIVATE key file in full, including the BEGIN and END lines — not the .pub file."
              exit 1 ;;
          esac

          echo "Configuration is usable. Connecting as a ${#clean_user}-character user to a ${#clean_host}-character host."

      - name: Report optional variables
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          if [ -z "$API_PUBLIC_URL" ]; then
            echo "::warning::Repository variable API_PUBLIC_URL is not set, so the post-deploy public smoke test will be skipped. The deploy still verifies health on the server itself."
          else
            echo "API_PUBLIC_URL = $API_PUBLIC_URL"
          fi

  build:
    name: Build and test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The only gate between a push and production.
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish (self-contained)
        run: |
          dotnet publish src/AadhiCrackers.Api/AadhiCrackers.Api.csproj \
            -c Release \
            -r ${{ env.RUNTIME_ID }} \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:DebugType=none \
            -o publish

          # Belt and braces: the csproj already excludes these from publish, but a release
          # carrying local development credentials to the server must be impossible.
          rm -f publish/appsettings.Development.json publish/appsettings.Development.json.example

          if [ -f publish/appsettings.Development.json ]; then
            echo "::error::appsettings.Development.json is still in the publish output."
            exit 1
          fi
          if [ ! -f publish/AadhiCrackers.Api ]; then
            echo "::error::No AadhiCrackers.Api executable in the publish output — the self-contained publish did not produce an apphost."
            exit 1
          fi

          echo "Publish size: $(du -sh publish | cut -f1)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-release
          path: publish/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # deploy-release.sh is shipped from the repo rather than trusted from the box,
      # so the script and the release it activates always come from the same commit.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: api-release
          path: publish

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          # Sanitize username and host (strip CRLF, spaces, quotes, email domains)
          TARGET_USER=$(echo "$USER" | tr -d '\r\n\t "' | sed 's/@.*//')
          TARGET_USER="${TARGET_USER:-ubuntu}"
          TARGET_HOST=$(echo "$HOST" | tr -d '\r\n\t "' | sed -E 's|^https?://||; s|/.*||')
          echo "TARGET_USER=$TARGET_USER" >> "$GITHUB_ENV"
          echo "TARGET_HOST=$TARGET_HOST" >> "$GITHUB_ENV"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the host key on first use, so the deploy fails loudly if the host identity
          # ever changes rather than silently trusting a different machine.
          ssh-keyscan -T 15 -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! grep -q . ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::ssh-keyscan got no host key from '$TARGET_HOST'. Check LIGHTSAIL_HOST resolves, that port 22 is open in the Lightsail console firewall, and that the instance is running."
            exit 1
          fi

      - name: Verify the connection
        run: |
          # The error deliberately avoids printing the target: Actions masks secret values, so
          # "Cannot SSH to $TARGET_USER@$TARGET_HOST" renders as "Cannot SSH to ***@***" and
          # helps nobody. ssh's own stderr is shown instead, which names the real cause
          # (permission denied / connection refused / timeout), and the guidance below is the
          # checklist for each of those.
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                 "$TARGET_USER@$TARGET_HOST" 'echo "connected to $(hostname) as $(whoami)"'; then
            echo "::error::SSH to the Lightsail instance failed — ssh's own message above says which of these it is:"
            echo "  • 'Permission denied (publickey)'  -> the PUBLIC half of LIGHTSAIL_SSH_KEY is not in ~/.ssh/authorized_keys for that user on the instance. Run: ssh-copy-id -i deploy_key.pub ubuntu@<static-ip>"
            echo "  • 'Connection timed out'           -> port 22 is closed in the Lightsail console firewall, or the instance is stopped."
            echo "  • 'Connection refused'             -> the instance is up but sshd is not listening."
            echo "  • 'invalid format' / libcrypto     -> LIGHTSAIL_SSH_KEY is not a complete OpenSSH private key (BEGIN/END lines included, not the .pub file)."
            exit 1
          fi

          # rsync writes straight into the releases directory; provision-lightsail.sh grants
          # this through group membership, which only takes effect after a fresh login.
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$TARGET_USER@$TARGET_HOST" "test -w ${{ env.APP_ROOT }}/releases"; then
            echo "::error::$TARGET_USER cannot write to ${{ env.APP_ROOT }}/releases. Run provision-lightsail.sh, then log out and back in once so the 'aadhi' group membership applies."
            exit 1
          fi

      - name: Upload release
        run: |
          RELEASE_ID="${{ github.sha }}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

          ssh -i ~/.ssh/deploy_key "$TARGET_USER@$TARGET_HOST" "mkdir -p ${{ env.APP_ROOT }}/releases/$RELEASE_ID"
          rsync -az --delete --info=stats1 \
            -e "ssh -i ~/.ssh/deploy_key" \
            publish/ "$TARGET_USER@$TARGET_HOST:${{ env.APP_ROOT }}/releases/$RELEASE_ID/"

      - name: Activate release
        run: |
          scp -i ~/.ssh/deploy_key deploy/deploy-release.sh "$TARGET_USER@$TARGET_HOST:/tmp/deploy-release.sh"
          ssh -i ~/.ssh/deploy_key "$TARGET_USER@$TARGET_HOST" "bash /tmp/deploy-release.sh '${RELEASE_ID}'"

      # deploy-release.sh already health-checks on the server and rolls back on failure.
      # This confirms the same release is reachable from OUTSIDE — through DNS, the Lightsail
      # firewall, nginx and TLS, none of which the on-box check touches.
      - name: Smoke test the public endpoint
        if: ${{ vars.API_PUBLIC_URL != '' }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "${{ vars.API_PUBLIC_URL }}/health/ready"; then
              echo ""
              echo "Public health check OK."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s."
            sleep 5
          done
          echo "::error::${{ vars.API_PUBLIC_URL }}/health/ready did not respond. The release is live and healthy ON THE SERVER but is not reachable publicly — check nginx, TLS and the Lightsail firewall."
          exit 1

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
