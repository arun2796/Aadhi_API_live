name: Nightly database backup

on:
  schedule:
    # Every day at 21:00 UTC
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump Neon database
    runs-on: ubuntu-latest
    steps:
      - name: Check that the NEON_DATABASE_URL secret is configured
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::The repository secret NEON_DATABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> New repository secret, using the Neon connection string (postgresql://user:password@host/dbname?sslmode=require&channel_binding=require). See RESTORE.md at the repo root."
            exit 1
          fi
          echo "Secret is configured."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump database
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -o pipefail
          STAMP="$(date -u +%F)"
          echo "Dumping to backup-${STAMP}.sql.gz"
          pg_dump "$NEON_DATABASE_URL" --no-owner --no-privileges | gzip > "backup-${STAMP}.sql.gz"
          ls -lh "backup-${STAMP}.sql.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 30
          if-no-files-found: error
